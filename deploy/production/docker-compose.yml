services:
  postgres:
    image: postgres:15-alpine
    container_name: petstore-postgres
    environment:
      POSTGRES_USER: petshop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petshop123}
      POSTGRES_DB: petshop
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petshop -d petshop"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - petstore_prod

  redis:
    image: redis:7-alpine
    container_name: petstore-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - petstore_prod

  meilisearch:
    image: getmeili/meilisearch:v1.14
    container_name: petstore-meilisearch
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY:-petshop-meili-key}
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    restart: unless-stopped
    networks:
      - petstore_prod

  backend:
    build:
      context: ../../
      dockerfile: backend/Dockerfile
    container_name: petstore-backend
    environment:
      APP_ENV: prod
      API_DOMAIN: api.pawpalai.cn
      ADMIN_DOMAIN: admin.pawpalai.cn
      STAGING_API_DOMAIN: staging.api.pawpalai.cn
      DATABASE_URL: postgresql+asyncpg://petshop:${POSTGRES_PASSWORD:-petshop123}@postgres:5432/petshop
      REDIS_URL: redis://redis:6379/0
      MEILISEARCH_URL: http://meilisearch:7700
    env_file:
      - ./.env.production
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - backend_logs:/app/logs
      - backend_uploads:/app/uploads
    networks:
      - petstore_prod

  admin:
    build:
      context: ../../admin
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /v1
    container_name: petstore-admin
    environment:
      VITE_API_URL: /v1
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - petstore_prod

  nginx:
    image: nginx:1.27-alpine
    container_name: petstore-nginx
    depends_on:
      - backend
      - admin
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - nginx_logs:/var/log/nginx
    restart: unless-stopped
    networks:
      - petstore_prod

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:
  backend_logs:
  backend_uploads:
  nginx_logs:

networks:
  petstore_prod:
    driver: bridge
